<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 05 — WebGL planes synced to DOM images</title>
    <link rel="stylesheet" href="../_shared/lab.css" />
    <style>
      canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .gallery { display: grid; gap: 12vh; padding: 30vh 10vw 60vh; }
      /* The DOM element stays for layout, SEO and a11y; WebGL draws on top */
      .media { aspect-ratio: 4 / 3; width: min(560px, 80vw); border-radius: 20px; background: #14173d; }
      .media:nth-child(even) { justify-self: end; }
      .gl-ready .media { visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas class="gl"></canvas>
    <main class="gallery">
      <div class="media" data-gl role="img" aria-label="Imagen 1"></div>
      <div class="media" data-gl role="img" aria-label="Imagen 2"></div>
      <div class="media" data-gl role="img" aria-label="Imagen 3"></div>
      <div class="media" data-gl role="img" aria-label="Imagen 4"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
