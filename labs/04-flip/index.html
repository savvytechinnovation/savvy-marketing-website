<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 04 — GSAP Flip (shared element)</title>
    <link rel="stylesheet" href="../_shared/lab.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(4, 120px); gap: 16px; padding: 40px; }
      .grid .box { width: 120px; height: 120px; }
      .detail { position: fixed; inset: 10vh 10vw; }
      .detail .box { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="grid"><div class="box" data-flip-id="a"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
    <div class="detail"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
